<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerbalIA · Sin conexión</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f4ec;
      color: #22352c;
      text-align: center;
      padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #17211b; color: #ece7da; }
      .card { background: #202d25 !important; border-color: #2e4034 !important; }
      p { color: #b9c4ba !important; }
    }
    .card {
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e2ddcf;
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 10px 30px rgba(34, 53, 44, 0.08);
    }
    .logo { font-size: 40px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: #5b6a5f; line-height: 1.6; margin: 0; font-size: 15px; }
    .hint { margin-top: 16px; font-size: 13px; opacity: 0.8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">🧭</div>
    <h1>El barco está en el muelle</h1>
    <p>
      Ahora mismo no hay conexión, y esta pantalla aún no se había guardado en tu dispositivo.
      Vuelve a abrir VerbalIA una vez con internet y quedará lista para navegar sin conexión.
    </p>
    <p class="hint">Tu progreso está a salvo: se guarda en el propio dispositivo.</p>
  </main>
</body>
</html>
